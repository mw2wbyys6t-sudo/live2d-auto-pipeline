name: Tauri Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'native/face_tracker/**'
      - 'scripts/build_desktop_bundle.py'
      - 'scripts/build_tauri_release.*'
      - 'scripts/run_tauri_dev.*'
      - 'requirements.desktop.txt'
      # 应用源码变更同样会进入安装包（web 静态站、Go 后端、Python 内核），
      # 缺少这些路径会导致「改了功能但安装包不重建」。
      - 'web/**'
      - 'api/**'
      - 'core/**'
      - 'drivers/**'
      - 'live2d_builder/**'
      - 'llm_bridge/**'
      - 'api_server.py'
      - '.github/workflows/tauri-build.yml'

# 仅检出代码与上传构建产物，不需要任何写权限
permissions:
  contents: read

jobs:
  build-tauri:
    name: Build Tauri NSIS Installer (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          # 模块在 api/ 子目录：内置缓存默认只认根目录 go.sum，会刷告警；
          # 缓存由后面的 Cache Go modules 步骤按 api/go.sum 处理。
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            desktop/target
            ~/.cargo/registry
            ~/.cargo/git
          key: tauri-${{ hashFiles('desktop/Cargo.lock', 'desktop/Cargo.toml') }}
          restore-keys: tauri-

      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('web/package-lock.json') }}

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('api/go.sum') }}

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend static export
        working-directory: web
        run: npx next build
        env:
          NEXT_STATIC_EXPORT: '1'

      - name: Version asset URLs
        run: node scripts/version-assets.mjs web/out

      - name: Copy static output to embed dir
        run: |
          if (Test-Path api/webui/dist) { Remove-Item -Recurse -Force api/webui/dist }
          New-Item -ItemType Directory -Force -Path api/webui/dist | Out-Null
          Copy-Item -Recurse -Force web/out/* api/webui/dist/
        shell: pwsh

      - name: Build Go binary (with embedded frontend)
        working-directory: api
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o live2d-api.exe .

      - name: Build Rust face_tracker (native face capture)
        working-directory: native/face_tracker
        run: cargo build --release --verbose

      # 签名原生二进制。默认 Mode=off 直接跳过；配置 vars.L2D_SIGN_MODE
      # 与任一签名凭据（SIGN_COMMAND / PFX / THUMBPRINT）后才真正生效。
      # 必须在装配 bundle 之前签，这样安装包内嵌的 exe 也带签名。
      - name: Sign native binaries (no-op unless configured)
        shell: pwsh
        env:
          L2D_SIGN_MODE: ${{ vars.L2D_SIGN_MODE || 'off' }}
          L2D_SIGN_COMMAND: ${{ secrets.L2D_SIGN_COMMAND }}
          L2D_SIGN_PFX_BASE64: ${{ secrets.L2D_SIGN_PFX_BASE64 }}
          L2D_SIGN_PFX_PASSWORD: ${{ secrets.L2D_SIGN_PFX_PASSWORD }}
          L2D_SIGN_THUMBPRINT: ${{ secrets.L2D_SIGN_THUMBPRINT }}
        run: |
          $params = @{
            Path        = @('api/live2d-api.exe', 'native/face_tracker/target/release/face_tracker.exe')
            Mode        = $env:L2D_SIGN_MODE
            SignCommand = $env:L2D_SIGN_COMMAND
            PfxBase64   = $env:L2D_SIGN_PFX_BASE64
            PfxPassword = $env:L2D_SIGN_PFX_PASSWORD
            Thumbprint  = $env:L2D_SIGN_THUMBPRINT
          }
          ./scripts/windows/sign_artifacts.ps1 @params
          exit $LASTEXITCODE

      - name: Set up Python (for the bundled desktop runtime)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Cache bundled runtime downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/desktop-bundle
          key: desktop-bundle-${{ hashFiles('requirements.desktop.txt') }}
          restore-keys: desktop-bundle-

      # 装配「安装包自带运行时」：嵌入式 CPython + 全量离线 wheel + 源码树
      # + Go 后端 + 面捕 exe/dll/YuNet。产物 desktop/bundle/ 由
      # tauri.conf.json 的 resources map {"bundle/": ""} 扁平打进 $RESOURCE，
      # 与 api/config/desktop.go 的 resolveDesktopRoot 约定对齐。
      - name: Assemble desktop runtime bundle
        run: |
          # torch / mediapipe 包内路径很深，直接在仓库路径下装配会撞 Windows 260 字符限制。
          # 先装配到短路径（%RUNNER_TEMP%\l2d），完成后再整目录移回 desktop\bundle。
          python scripts/build_desktop_bundle.py --dest "$env:RUNNER_TEMP\l2d" --go-exe api/live2d-api.exe --face-tracker-exe native/face_tracker/target/release/face_tracker.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path desktop/bundle) { Remove-Item -Recurse -Force desktop/bundle }
          Move-Item "$env:RUNNER_TEMP\l2d" desktop/bundle
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'

      - name: Show Tauri config
        run: Get-Content desktop/tauri.conf.json
        shell: pwsh

      - name: List assembled bundle (top level)
        run: Get-ChildItem -Force desktop/bundle | Select-Object Name, Length
        shell: pwsh

      - name: Build Tauri app + NSIS installer
        working-directory: desktop
        run: cargo tauri build --bundles nsis --verbose

      # 签名 Tauri 壳与最终 NSIS 安装包（用户实际双击的就是这个 setup.exe）。
      - name: Sign installer and app shell (no-op unless configured)
        shell: pwsh
        env:
          L2D_SIGN_MODE: ${{ vars.L2D_SIGN_MODE || 'off' }}
          L2D_SIGN_COMMAND: ${{ secrets.L2D_SIGN_COMMAND }}
          L2D_SIGN_PFX_BASE64: ${{ secrets.L2D_SIGN_PFX_BASE64 }}
          L2D_SIGN_PFX_PASSWORD: ${{ secrets.L2D_SIGN_PFX_PASSWORD }}
          L2D_SIGN_THUMBPRINT: ${{ secrets.L2D_SIGN_THUMBPRINT }}
        run: |
          $params = @{
            Path        = @('desktop/target/release/live2d-master-agent.exe', 'desktop/target/release/bundle/nsis/*.exe')
            Mode        = $env:L2D_SIGN_MODE
            SignCommand = $env:L2D_SIGN_COMMAND
            PfxBase64   = $env:L2D_SIGN_PFX_BASE64
            PfxPassword = $env:L2D_SIGN_PFX_PASSWORD
            Thumbprint  = $env:L2D_SIGN_THUMBPRINT
          }
          ./scripts/windows/sign_artifacts.ps1 @params
          exit $LASTEXITCODE

      - name: List build output
        run: |
          Write-Host "=== NSIS installer ==="
          Get-ChildItem -Recurse desktop/target/release/bundle -ErrorAction SilentlyContinue
          Write-Host "=== Standalone exe ==="
          Get-ChildItem desktop/target/release/*.exe -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Upload NSIS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tauri-nsis-installer
          path: desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload standalone exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tauri-standalone-exe
          # 二进制名来自 desktop/Cargo.toml 的 package.name（live2d-master-agent），
          # 不是 productName「Live2D Master Agent」。此前按 productName 找导致
          # 永远命中不到、被 if-no-files-found 静默跳过。
          # 注意：它只是 Tauri 窗口壳，必须配合安装目录里的 python/app/models 才能跑；
          # 完整可运行包请用上面的 NSIS 安装包。
          path: desktop/target/release/live2d-master-agent.exe
          if-no-files-found: warn
          retention-days: 30
