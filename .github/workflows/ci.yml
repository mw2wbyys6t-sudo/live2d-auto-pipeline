name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    # 推送 v* tag 时触发，使 release job（if: startsWith(github.ref, 'refs/tags/v')）能运行。
    # 此前只配 branches 导致 tag 推送不会触发本 workflow，release job 永远被 skipped。
    tags: ['v*']
  pull_request:
    branches: [main]
  # 手动入口：跑需要官方内核 + 逐像素验收的 moc3-acceptance job
  workflow_dispatch:
  # 每日北京时间 10:00（UTC 02:00）自动跑官方内核验收，关闭 F-10 盲区：
  # 默认 PR 的 CI 不装 live2d-py，"绿"不代表模型真能被官方内核接受；
  # 此定时任务强制装内核跑完整验收，发现回归时及时告警（GitHub 仅在默认分支执行 schedule）。
  schedule:
    - cron: '0 2 * * *'

# 最小权限默认：所有 job 只读；仅 release job 按需提升 contents: write。
permissions:
  contents: read

jobs:
  # ===== Python Tests =====
  python-tests:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libportaudio2 ffmpeg

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Install core deps first (always needed)
          pip install Pillow numpy requests urllib3 httpx aiohttp aiofiles websockets psd-tools scipy scikit-learn cryptography rich opencv-python onnxruntime
          # Python API server (api_server.py) deps. tests/integration/test_api_contract.py
          # and tests/unit/test_runtime_readiness.py import api_server at module scope,
          # so these must be present or pytest fails collection.
          pip install fastapi uvicorn python-multipart
          # Install test deps
          pip install pytest pytest-asyncio pytest-cov
          # Install optional deps with --no-deps to avoid pulling large model packages
          pip install edge-tts || true
          # py-moc3：容器结构参考与交叉校验（纯 Python，CI 安全）。
          # live2d-py（官方内核）**不在此安装**：其加载/渲染需要 GL 上下文，
          # 由下方 moc3-acceptance job 在带 xvfb 的环境里安装并跑完整验收。
          pip install py-moc3 || true
          pip install rembg[cpu] || true
          pip install mediapipe || true
          pip install "pygame>=2.5.0; python_version < '3.14'" || true
          pip install sounddevice soundfile || true

      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=core --cov=drivers --cov=llm_bridge --cov=live2d_builder --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml

      # FF-1 依赖方向 lint —— warn-only baseline。
      # 现存 8 处历史反向依赖（见 scripts/lint_architecture.py 顶部清单）尚未清零，
      # 故此处用 `|| true` 降级为"只产报告、不阻断 PR"；待 Sprint 2 清理后去掉 `|| true` 即恢复 PR 阻断。
      # 仅在 3.11 矩阵跑一次：lint 是静态 AST 扫描，与 Python 版本无关，跑 3 次只会撞 artifact 同名。
      - name: FF-1 架构依赖方向 lint（warn-only baseline）
        if: always() && matrix.python-version == '3.11'
        run: |
          python scripts/lint_architecture.py --json > ff1-report.json || true
          echo "::notice::FF-1 lint 已生成报告（warn-only baseline，不阻断 PR），详见 artifact ff1-architecture-lint"

      - name: 上传 FF-1 报告
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ff1-architecture-lint
          retention-days: 14
          path: ff1-report.json

  # ===== Go Tests & Build =====
  go-build:
    name: Go API Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          # 模块位于 api/ 子目录，setup-go 内置缓存默认只认仓库根的 go.sum
          # 会刷 "Dependencies file is not found: go.sum" 告警；缓存交给
          # 下面显式按 api/go.sum 建 key 的 Cache Go modules 步骤统一处理。
          cache: false

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('api/go.sum') }}

      - name: Go mod tidy
        working-directory: api
        run: go mod tidy

      - name: Go mod download
        working-directory: api
        run: go mod download

      - name: Go vet
        working-directory: api
        run: go vet ./...

      - name: Go build
        working-directory: api
        run: go build -o /tmp/live2d-api .

      # HealthCheck 会真的探针 Python（`python --version` + `import PIL` / `import numpy`），
      # 这里把探针要求的依赖装上，好让下面 LIVE2D_TEST_PYTHON 打开的真实路径用例能跑。
      - name: Set up Python for the Go health probe
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Python deps probed by the Go health check
        run: python -m pip install --upgrade pip Pillow numpy

      - name: Go test
        working-directory: api
        run: go test -v ./...
        env:
          # 打开「用真机解释器验证健康检查」用例；未设置时该用例自动跳过，不制造假失败。
          LIVE2D_TEST_PYTHON: python3

  # ===== Frontend Build =====
  frontend-build:
    name: Next.js Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('web/package-lock.json') }}

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: TypeScript check
        working-directory: web
        run: npx tsc --noEmit

      - name: Build
        working-directory: web
        run: npm run build

  # ===== moc3 Acceptance (官方内核 + 逐像素形变) =====
  # 默认 job 不装 live2d-py（加载/渲染需要 GL 上下文），所以一致性/加载/像素判据
  # 在默认 job 里会被 skip —— 那些"绿色"不能证明模型真能被官方内核接受。
  # 本 job 是"真的装上内核并跑完整验收"的唯一入口：只有它绿，才算模型能被加载、
  # 参数真的驱动画面。触发方式：workflow_dispatch（手动）+ schedule（每日 UTC 02:00 / 北京 10:00）；
  # schedule 仅在默认分支运行，回归出现时通过 Actions 失败 + 上传的 moc3-acceptance-evidence artifact 告警。
  moc3-acceptance:
    name: moc3 Acceptance (live2d-py + pixels)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install system deps (headless GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libegl1 xvfb cmake

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # httpx 必须显式安装：tests/integration 经 api_server 导入
          # starlette.TestClient，缺少 httpx 会在收集期报
          # "testclient module requires the httpx2 package"（与主 CI job 一致）。
          pip install Pillow numpy requests urllib3 httpx psd-tools scipy scikit-learn opencv-python onnxruntime
          pip install pytest pytest-asyncio
          # api_server.py import chain (used by the integration suite that runs here)
          pip install fastapi uvicorn python-multipart
          pip install py-moc3
          pip install live2d-py

      - name: Run moc3 acceptance suite
        env:
          LIVE2D_TEST_PIXELS: "1"
        run: |
          xvfb-run -a python -m pytest tests/integration -q --no-header \
            --junitxml=moc3-acceptance-junit.xml

      - name: 上传 moc3 验收证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moc3-acceptance-evidence
          retention-days: 14
          # junitxml 是验收步骤里唯一保证落盘的真实证据（集成测试主体写 pytest tmp_path，
          # 用完即清）。其余路径为前向兼容：当未来有测试往 Work/ output/ reports/ 落盘时
          # 自动纳入证据包；当下若不匹配，if-no-files-found=ignore 避免污染 cron 日志。
          if-no-files-found: ignore
          path: |
            moc3-acceptance-junit.xml
            Work/multiband-axis/
            Work/moc3-keyform-verification.json
            Work/moc3-pixel-judgments.json
            Work/native-sample/
            Work/export*/
            output/live2d/*.moc3
            output/live2d/*.model3.json
            tests/integration/reports/*.json

  # ===== Desktop Pet Package =====
  package-pet:
    name: Package Desktop Pet
    runs-on: ubuntu-latest
    needs: [python-tests]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libportaudio2 ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy requests urllib3 httpx aiohttp aiofiles websockets psd-tools scipy scikit-learn cryptography rich opencv-python onnxruntime
          pip install edge-tts || true
          pip install rembg[cpu] || true
          pip install "pygame>=2.5.0; python_version < '3.14'" || true

      - name: Generate example pet package
        run: |
          python -m core.workflow "anime girl with blue hair, cat ears, white background" --deploy-desktop --output ./dist/pet

      - name: Upload pet package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-pet-package
          path: ./dist/pet/

  # ===== Windows NSIS installer (tag 发布产物) =====
  # v0.10.6 的发布回归根因：release job 只上传 `dist/*`，而整个 workflow 从不
  # 生成 dist/*，导致「有 tag、有 Release、资产为空」。此 job 在 tag 推送时于
  # windows-latest 构建 NSIS 安装包（Go 后端 + 内嵌 Web UI + Rust 面捕），
  # 作为 release 资产上传。步骤与 tauri-build.yml 对齐：后者负责 main 分支的
  # 持续构建，本 job 只负责 tag 发布产物。
  windows-installer:
    name: Build Windows NSIS Installer
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend static export
        working-directory: web
        run: npx next build
        env:
          NEXT_STATIC_EXPORT: '1'

      - name: Version asset URLs
        run: node scripts/version-assets.mjs web/out

      - name: Copy static output to embed dir
        run: |
          if (Test-Path api/webui/dist) { Remove-Item -Recurse -Force api/webui/dist }
          New-Item -ItemType Directory -Force -Path api/webui/dist | Out-Null
          Copy-Item -Recurse -Force web/out/* api/webui/dist/
        shell: pwsh

      - name: Build Go binary (with embedded frontend)
        working-directory: api
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o live2d-api.exe .

      - name: Build Rust face_tracker
        working-directory: native/face_tracker
        run: cargo build --release

      # 签名原生二进制（默认 Mode=off 跳过）。必须在装配 bundle 之前签，
      # 这样发布出去安装包内嵌的 exe 也带签名。
      - name: Sign native binaries (no-op unless configured)
        shell: pwsh
        env:
          L2D_SIGN_MODE: ${{ vars.L2D_SIGN_MODE || 'off' }}
          L2D_SIGN_COMMAND: ${{ secrets.L2D_SIGN_COMMAND }}
          L2D_SIGN_PFX_BASE64: ${{ secrets.L2D_SIGN_PFX_BASE64 }}
          L2D_SIGN_PFX_PASSWORD: ${{ secrets.L2D_SIGN_PFX_PASSWORD }}
          L2D_SIGN_THUMBPRINT: ${{ secrets.L2D_SIGN_THUMBPRINT }}
        run: |
          $params = @{
            Path        = @('api/live2d-api.exe', 'native/face_tracker/target/release/face_tracker.exe')
            Mode        = $env:L2D_SIGN_MODE
            SignCommand = $env:L2D_SIGN_COMMAND
            PfxBase64   = $env:L2D_SIGN_PFX_BASE64
            PfxPassword = $env:L2D_SIGN_PFX_PASSWORD
            Thumbprint  = $env:L2D_SIGN_THUMBPRINT
          }
          ./scripts/windows/sign_artifacts.ps1 @params
          exit $LASTEXITCODE

      - name: Set up Python (for the bundled desktop runtime)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Cache bundled runtime downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/desktop-bundle
          key: desktop-bundle-${{ hashFiles('requirements.desktop.txt') }}
          restore-keys: desktop-bundle-

      # 装配安装包自带运行时（嵌入式 Python + 全量依赖 + 源码树 + exe/dll/模型）。
      # 产物 desktop/bundle/ 由 tauri.conf.json 的 resources map 打进 $RESOURCE。
      - name: Assemble desktop runtime bundle
        run: |
          # torch / mediapipe 包内路径很深，直接在仓库路径下装配会撞 Windows 260 字符限制。
          # 先装配到短路径（%RUNNER_TEMP%\l2d），完成后再整目录移回 desktop\bundle。
          python scripts/build_desktop_bundle.py --dest "$env:RUNNER_TEMP\l2d" --go-exe api/live2d-api.exe --face-tracker-exe native/face_tracker/target/release/face_tracker.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path desktop/bundle) { Remove-Item -Recurse -Force desktop/bundle }
          Move-Item "$env:RUNNER_TEMP\l2d" desktop/bundle
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'

      - name: Build Tauri app + NSIS installer
        working-directory: desktop
        run: cargo tauri build --bundles nsis

      # 签名最终 NSIS 安装包与 Tauri 壳（发布资产就是这里的 setup.exe）。
      - name: Sign installer and app shell (no-op unless configured)
        shell: pwsh
        env:
          L2D_SIGN_MODE: ${{ vars.L2D_SIGN_MODE || 'off' }}
          L2D_SIGN_COMMAND: ${{ secrets.L2D_SIGN_COMMAND }}
          L2D_SIGN_PFX_BASE64: ${{ secrets.L2D_SIGN_PFX_BASE64 }}
          L2D_SIGN_PFX_PASSWORD: ${{ secrets.L2D_SIGN_PFX_PASSWORD }}
          L2D_SIGN_THUMBPRINT: ${{ secrets.L2D_SIGN_THUMBPRINT }}
        run: |
          $params = @{
            Path        = @('desktop/target/release/live2d-master-agent.exe', 'desktop/target/release/bundle/nsis/*.exe')
            Mode        = $env:L2D_SIGN_MODE
            SignCommand = $env:L2D_SIGN_COMMAND
            PfxBase64   = $env:L2D_SIGN_PFX_BASE64
            PfxPassword = $env:L2D_SIGN_PFX_PASSWORD
            Thumbprint  = $env:L2D_SIGN_THUMBPRINT
          }
          ./scripts/windows/sign_artifacts.ps1 @params
          exit $LASTEXITCODE

      - name: Upload NSIS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nsis-installer
          path: desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  # ===== Release =====
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [python-tests, go-build, frontend-build, windows-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    # 唯一需要写权限的 job：发布 GitHub Release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download NSIS installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nsis-installer
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        # 全量运行时安装包可能超过 GitHub Release 单附件 2GB 上限。此时不阻断
        # 发布（Release 仍生成），安装包以 Actions 产物 nsis-installer 交付。
        continue-on-error: true
        with:
          generate_release_notes: true
          files: |
            dist/**/*.exe
