name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # 手动入口：跑需要官方内核 + 逐像素验收的 moc3-acceptance job
  workflow_dispatch:
  # 每日北京时间 10:00（UTC 02:00）自动跑官方内核验收，关闭 F-10 盲区：
  # 默认 PR 的 CI 不装 live2d-py，"绿"不代表模型真能被官方内核接受；
  # 此定时任务强制装内核跑完整验收，发现回归时及时告警（GitHub 仅在默认分支执行 schedule）。
  schedule:
    - cron: '0 2 * * *'

jobs:
  # ===== Python Tests =====
  python-tests:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libportaudio2 ffmpeg

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Install core deps first (always needed)
          pip install Pillow numpy requests urllib3 httpx aiohttp aiofiles websockets psd-tools scipy scikit-learn cryptography rich opencv-python onnxruntime
          # Python API server (api_server.py) deps. tests/integration/test_api_contract.py
          # and tests/unit/test_runtime_readiness.py import api_server at module scope,
          # so these must be present or pytest fails collection.
          pip install fastapi uvicorn python-multipart
          # Install test deps
          pip install pytest pytest-asyncio pytest-cov
          # Install optional deps with --no-deps to avoid pulling large model packages
          pip install edge-tts || true
          # py-moc3：容器结构参考与交叉校验（纯 Python，CI 安全）。
          # live2d-py（官方内核）**不在此安装**：其加载/渲染需要 GL 上下文，
          # 由下方 moc3-acceptance job 在带 xvfb 的环境里安装并跑完整验收。
          pip install py-moc3 || true
          pip install rembg[cpu] || true
          pip install mediapipe || true
          pip install "pygame>=2.5.0; python_version < '3.14'" || true
          pip install sounddevice soundfile || true

      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=core --cov=drivers --cov=llm_bridge --cov=live2d_builder --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml

      # FF-1 依赖方向 lint —— warn-only baseline。
      # 现存 8 处历史反向依赖（见 scripts/lint_architecture.py 顶部清单）尚未清零，
      # 故此处用 `|| true` 降级为"只产报告、不阻断 PR"；待 Sprint 2 清理后去掉 `|| true` 即恢复 PR 阻断。
      # 仅在 3.11 矩阵跑一次：lint 是静态 AST 扫描，与 Python 版本无关，跑 3 次只会撞 artifact 同名。
      - name: FF-1 架构依赖方向 lint（warn-only baseline）
        if: always() && matrix.python-version == '3.11'
        run: |
          python scripts/lint_architecture.py --json > ff1-report.json || true
          echo "::notice::FF-1 lint 已生成报告（warn-only baseline，不阻断 PR），详见 artifact ff1-architecture-lint"

      - name: 上传 FF-1 报告
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: ff1-architecture-lint
          retention-days: 14
          path: ff1-report.json

  # ===== Go Tests & Build =====
  go-build:
    name: Go API Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('api/go.sum') }}

      - name: Go mod tidy
        working-directory: api
        run: go mod tidy

      - name: Go mod download
        working-directory: api
        run: go mod download

      - name: Go vet
        working-directory: api
        run: go vet ./...

      - name: Go build
        working-directory: api
        run: go build -o /tmp/live2d-api .

      - name: Go test
        working-directory: api
        run: go test -v ./...

  # ===== Frontend Build =====
  frontend-build:
    name: Next.js Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('web/package-lock.json') }}

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: TypeScript check
        working-directory: web
        run: npx tsc --noEmit

      - name: Build
        working-directory: web
        run: npm run build

  # ===== moc3 Acceptance (官方内核 + 逐像素形变) =====
  # 默认 job 不装 live2d-py（加载/渲染需要 GL 上下文），所以一致性/加载/像素判据
  # 在默认 job 里会被 skip —— 那些"绿色"不能证明模型真能被官方内核接受。
  # 本 job 是"真的装上内核并跑完整验收"的唯一入口：只有它绿，才算模型能被加载、
  # 参数真的驱动画面。触发方式：workflow_dispatch（手动）+ schedule（每日 UTC 02:00 / 北京 10:00）；
  # schedule 仅在默认分支运行，回归出现时通过 Actions 失败 + 上传的 moc3-acceptance-evidence artifact 告警。
  moc3-acceptance:
    name: moc3 Acceptance (live2d-py + pixels)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (headless GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libegl1 xvfb cmake

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy requests psd-tools scipy scikit-learn opencv-python onnxruntime
          pip install pytest pytest-asyncio
          # api_server.py import chain (used by the integration suite that runs here)
          pip install fastapi uvicorn python-multipart
          pip install py-moc3
          pip install live2d-py

      - name: Run moc3 acceptance suite
        env:
          LIVE2D_TEST_PIXELS: "1"
        run: |
          xvfb-run -a python -m pytest tests/integration -q --no-header \
            --junitxml=moc3-acceptance-junit.xml

      - name: 上传 moc3 验收证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moc3-acceptance-evidence
          retention-days: 14
          # junitxml 是验收步骤里唯一保证落盘的真实证据（集成测试主体写 pytest tmp_path，
          # 用完即清）。其余路径为前向兼容：当未来有测试往 Work/ output/ reports/ 落盘时
          # 自动纳入证据包；当下若不匹配，if-no-files-found=ignore 避免污染 cron 日志。
          if-no-files-found: ignore
          path: |
            moc3-acceptance-junit.xml
            Work/multiband-axis/
            Work/moc3-keyform-verification.json
            Work/moc3-pixel-judgments.json
            Work/native-sample/
            Work/export*/
            output/live2d/*.moc3
            output/live2d/*.model3.json
            tests/integration/reports/*.json

  # ===== Docker Build =====
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [python-tests, go-build, frontend-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: live2d-master-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== Desktop Pet Package =====
  package-pet:
    name: Package Desktop Pet
    runs-on: ubuntu-latest
    needs: [python-tests]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libportaudio2 ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy requests urllib3 httpx aiohttp aiofiles websockets psd-tools scipy scikit-learn cryptography rich opencv-python onnxruntime
          pip install edge-tts || true
          pip install rembg[cpu] || true
          pip install "pygame>=2.5.0; python_version < '3.14'" || true

      - name: Generate example pet package
        run: |
          python -m core.workflow "anime girl with blue hair, cat ears, white background" --deploy-desktop --output ./dist/pet

      - name: Upload pet package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-package
          path: ./dist/pet/

  # ===== Release =====
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [python-tests, go-build, frontend-build, docker-build]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
