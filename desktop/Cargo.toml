[package]
name = "pygmalion-studio"
version = "0.10.10"
description = "Pygmalion Studio - Desktop Application (Pygmalion)"
authors = ["Pygmalion"]
edition = "2021"
# SPDX 许可证标识：此前缺失，导致 crates.io / FOSSA 的许可扫描拿不到本 crate 的
# 许可信息（`cargo metadata` 里 license 为 null）。与根目录 LICENSE 一致。
license = "AGPL-3.0-only"

[lib]
name = "pygmalion_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
