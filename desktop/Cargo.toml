[package]
name = "pygmalion-studio"
version = "0.10.12"
description = "Pygmalion Studio - Desktop Application (Pygmalion)"
authors = ["Pygmalion"]
edition = "2021"
# SPDX 许可证标识：此前缺失，导致 crates.io / FOSSA 的许可扫描拿不到本 crate 的
# 许可信息（`cargo metadata` 里 license 为 null）。与根目录 LICENSE 一致。
license = "AGPL-3.0-only"

[lib]
name = "pygmalion_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 自动更新：启动后查 GitHub Release 的 latest.json，有新版则下载安装并重启。
# 签名校验用 tauri.conf.json 的 plugins.updater.pubkey；私钥只存在于 CI secret
# 与本机 ~/.tauri/，绝不入库。
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
