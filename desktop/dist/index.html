<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live2D Master Agent</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    .container {
      text-align: center;
      max-width: 520px;
      padding: 2rem;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      opacity: 0.5;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 1rem;
    }
    .status {
      font-size: 0.9rem;
      color: #7d8590;
      line-height: 1.8;
      white-space: pre-line;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 1.5rem auto;
    }
    .spinner.error {
      border: 3px solid #f8514955;
      border-top-color: #f85149;
      animation: none;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    code {
      display: inline-block;
      background: #161b22;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      color: #79c0ff;
    }
    #errorBox { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <img class="icon" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2358a6ff' stroke-width='1.5'%3E%3Crect x='3' y='3' width='18' height='18' rx='2'/%3E%3Cpath d='M9 9l6 6M15 9l-6 6'/%3E%3C/svg%3E" alt="logo">
    <div id="loadingBox">
      <h1>正在启动后端...</h1>
      <div class="spinner"></div>
      <p class="status">Go API 服务正在初始化，请稍候</p>
    </div>
    <div id="errorBox">
      <h1>后端未找到</h1>
      <div class="spinner error"></div>
      <p class="status">请先编译 Go API 服务：
        <br><br>
        <code>cd api</code>
        <br>
        <code>go build -o live2d-api.exe .</code>
        <br><br>
        然后重新启动本程序</p>
    </div>
  </div>
  <script>
    if (window.__TAURI_INTERNALS__) {
      window.__TAURI_INTERNALS__.invoke('check_backend').then(function(running) {
        if (running) {
          window.location.href = 'http://localhost:8080';
        } else {
          document.getElementById('loadingBox').style.display = 'none';
          document.getElementById('errorBox').style.display = 'block';
        }
      });
      window.__TAURI_INTERNALS__.listen('backend-error', function() {
        document.getElementById('loadingBox').style.display = 'none';
        document.getElementById('errorBox').style.display = 'block';
      });
    }
  </script>
</body>
</html>
